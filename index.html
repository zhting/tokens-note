<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工具额度 & 订阅管理</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232734;
      --border: #2e3347;
      --accent: #6c5ce7;
      --accent-soft: rgba(108, 92, 231, 0.15);
      --green: #00cec9;
      --green-soft: rgba(0, 206, 201, 0.12);
      --orange: #f0932b;
      --orange-soft: rgba(240, 147, 43, 0.12);
      --red: #ff6b6b;
      --red-soft: rgba(255, 107, 107, 0.12);
      --text: #e8e8f0;
      --text2: #8888a8;
      --text3: #55557a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), #a29bfe);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo p {
      font-size: 12px;
      color: var(--text2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #5a4bd6; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: #3e4460; }

    .btn-danger {
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid transparent;
    }
    .btn-danger:hover { border-color: var(--red); }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Stats Row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text3);
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .stat-card .sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    .stat-card.accent .value { color: var(--accent); }
    .stat-card.green .value { color: var(--green); }
    .stat-card.orange .value { color: var(--orange); }
    .stat-card.red .value { color: var(--red); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text3); }

    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      transition: all 0.15s;
    }
    .chip:hover, .chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ── Cards Grid ── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: #3e4460;
      transform: translateY(-1px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      border-radius: var(--radius) 0 0 var(--radius);
    }

    .card.status-ok::before { background: var(--green); }
    .card.status-warning::before { background: var(--orange); }
    .card.status-danger::before { background: var(--red); }
    .card.status-reset::before { background: var(--accent); }

    .provider-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: grid; place-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .provider-icon svg {
      width: 20px; height: 20px;
    }

    .provider-custom svg { opacity: 0.4; }

    .card-icon svg {
      width: 22px; height: 22px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .card-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .card-actions { opacity: 1; }

    .icon-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 13px;
      transition: all 0.15s;
    }

    .icon-btn:hover { color: var(--text); border-color: #3e4460; }
    .icon-btn.del:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .card-provider {
      font-size: 12px;
      color: var(--text3);
    }

    .card-dates {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .date-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .date-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text3);
      white-space: nowrap;
      min-width: 60px;
    }

    .date-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .date-value.overdue { color: var(--red); }
    .date-value.soon { color: var(--orange); }
    .date-value.ok { color: var(--green); }
    .date-value.reset { color: var(--accent); }

    .reset-highlight {
      color: var(--accent) !important;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }


    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 100;
    }

    .modal-overlay.open { display: grid; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group select option { background: var(--surface2); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty h3 {
      color: var(--text2);
      margin-bottom: 8px;
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text);
      animation: toastIn 0.25s ease, toastOut 0.25s ease 2.5s forwards;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

    /* ── Export/Import ── */
    .toolbar-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <div>
          <h1>AI 工具额度管理</h1>
          <p>记录重置与订阅到期时间</p>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openModal()">＋ 添加工具</button>
    </header>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="search-box" type="text" placeholder="搜索工具名称…" oninput="render(this.value)" />
      <div class="filter-chips">
        <button class="chip active" onclick="setFilter('all', this)">全部</button>
        <button class="chip" onclick="setFilter('danger', this)">已过期</button>
        <button class="chip" onclick="setFilter('warning', this)">即将到期</button>
        <button class="chip" onclick="setFilter('reset', this)">即将重置</button>
        <button class="chip" onclick="setFilter('ok', this)">正常</button>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" onclick="resetDefaults()" title="重置为默认数据">↺ 重置</button>
      <button class="btn btn-ghost btn-sm" onclick="exportData()" title="导出 JSON">↓ 导出</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()" title="导入 JSON">↑ 导入</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
      </div>
    </div>

    <!-- Cards -->
    <div class="cards" id="cards"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2 id="modalTitle">✦ 添加工具</h2>
      <input type="hidden" id="editId" />

      <div class="form-group">
        <label>工具名称 *</label>
        <input id="fName" placeholder="例如：ChatGPT Plus" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>提供商</label>
          <input id="fProvider" placeholder="OpenAI / Anthropic…" list="dlProviders" />
          <datalist id="dlProviders">
            <option value="OpenAI">
            <option value="Anthropic">
            <option value="xAI">
            <option value="Moonshot AI">
            <option value="Sapiens AI">
            <option value="Cursor">
          </datalist>
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="fCategory">
            <option value="chat">聊天助手</option>
            <option value="coding">编程助手</option>
            <option value="image">图像生成</option>
            <option value="voice">语音 / 音频</option>
            <option value="search">搜索 / 研究</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>额度重置</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="fResetPeriod" onchange="updateDayOptions('Reset')" style="flex:0 0 90px">
            <option value="weekly" selected>每周</option>
            <option value="monthly">每月</option>
          </select>
          <select id="fReset" style="flex:1;min-width:120px" onchange="updateResetTimeVisibility()">
            <option value="">—</option>
          </select>
          <div id="fResetTimeGroup" style="display:none;gap:4px;align-items:center">
            <input id="fResetHour" type="time" value="00:00" style="width:80px;padding:8px 6px;font-size:13px" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>订阅到期</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="fExpiryPeriod" onchange="updateDayOptions('Expiry')" style="flex:0 0 90px">
            <option value="monthly" selected>每月</option>
            <option value="weekly">每周</option>
          </select>
          <select id="fExpiry" style="flex:1;min-width:120px">
            <option value="">—</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>额度使用</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="fQuotaPct" type="number" min="0" max="100" step="0.1" placeholder="例如：32.4" style="flex:1" />
          <span style="color:var(--text3);font-size:13px">%</span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveTool()">保存</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script>
    // ── Data ──
    const DEFAULT_TOOLS = [
      {
        id: 'demo-chatgpt',
        name: 'ChatGPT Plus',
        provider: 'OpenAI',
        category: 'chat',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: 32.4,
        created: new Date().toISOString()
      },
      {
        id: 'demo-claude',
        name: 'Claude Pro',
        provider: 'Anthropic',
        category: 'chat',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: null,
        created: new Date().toISOString()
      },
      {
        id: 'demo-grok',
        name: 'Grok',
        provider: 'xAI',
        category: 'chat',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: 17.8,
        created: new Date().toISOString()
      },
      {
        id: 'demo-kimi',
        name: 'Kimi',
        provider: 'Moonshot AI',
        category: 'chat',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: 21.0,
        created: new Date().toISOString()
      },
      {
        id: 'demo-agnes',
        name: 'Agnes (Sapiens AI)',
        provider: 'Sapiens AI',
        category: 'chat',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: null,
        created: new Date().toISOString()
      },
      {
        id: 'demo-cursor',
        name: 'Cursor',
        provider: 'Cursor',
        category: 'coding',
        reset: { period: 'weekly', day: 1, hour: 0, minute: 0 },
        expiry: { period: 'monthly', day: 7 },
        quotaPct: null,
        created: new Date().toISOString()
      }
    ];

    const STORAGE_KEY = 'ai_tool_tracker';
    let tools = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    // 数据迁移：旧数据补全缺失的字段
    const hadMigration = tools.some(t => t.__migrated);
    tools = tools.map(t => ({
      ...t,
      __migrated: true,
      id: t.id || uid(),
      name: t.name || '',
      provider: t.provider || '',
      category: t.category || 'chat',
      reset: t.reset ? {
        period: t.reset.period || 'weekly',
        day: t.reset.day != null ? parseInt(t.reset.day) : 1,
        hour: t.reset.hour != null ? parseInt(t.reset.hour) : 0,
        minute: t.reset.minute != null ? parseInt(t.reset.minute) : 0,
      } : { period: 'weekly', day: 1, hour: 0, minute: 0 },
      expiry: t.expiry ? { period: t.expiry.period || 'monthly', day: t.expiry.day != null ? parseInt(t.expiry.day) : 7 } : { period: 'monthly', day: 7 },
      quotaPct: t.quotaPct != null ? parseFloat(t.quotaPct) : null,
      created: t.created || new Date().toISOString()
    }));

    // 写入迁移后的数据
    if (!hadMigration || tools.length === 0) {
      if (tools.length === 0) tools = [...DEFAULT_TOOLS];
      persist();
    }

    // 初始化月度选择器
    function populateDaySelectors() {
      updateDayOptions('Reset');
      updateDayOptions('Expiry');
    }

    function updateDayOptions(prefix) {
      const periodSel = document.getElementById('f' + prefix + 'Period');
      const daySel = document.getElementById('f' + prefix);
      const period = periodSel.value;

      daySel.innerHTML = '';

      if (period === 'weekly') {
        const days = ['周日','周一','周二','周三','周四','周五','周六'];
        days.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = d;
          daySel.appendChild(opt);
        });
        if (prefix === 'Reset') updateResetTimeVisibility();
      } else if (period === 'monthly') {
        for (let d = 1; d <= 31; d++) {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = `${d} 日`;
          daySel.appendChild(opt);
        }
        if (prefix === 'Reset') {
          document.getElementById('fResetTimeGroup').style.display = 'none';
        }
      }
    }

    function updateResetTimeVisibility() {
      const period = document.getElementById('fResetPeriod').value;
      const timeGroup = document.getElementById('fResetTimeGroup');
      timeGroup.style.display = period === 'weekly' ? 'flex' : 'none';
    }

    const CATEGORY_EMOJI = {
      chat: '💬', coding: '⌨️', image: '🎨', voice: '🎙️', search: '🔍', other: '🛠️'
    };

    const PROVIDER_ICONS = {
      'OpenAI': {
        color: '#10a37f',

    function getProviderIcon(name) {
      if (!name) return null;
      const key = Object.keys(PROVIDER_ICONS).find(k => name.toLowerCase().includes(k.toLowerCase()));
      if (key) return PROVIDER_ICONS[key];
      return null;
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tools));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function daysUntil(period, dayValue, hour = 0, minute = 0) {
      if (!period || dayValue == null) return null;
      const now = new Date();

      if (period === 'monthly') {
        const next = new Date(now.getFullYear(), now.getMonth(), dayValue);
        next.setHours(hour || 0, minute || 0, 0, 0);
        if (next <= now) next.setMonth(next.getMonth() + 1);
        const diffDays = Math.ceil((next - now) / 86400000);
        return diffDays > 0 ? diffDays : 0;
      } else if (period === 'weekly') {
        const dayOfWeek = parseInt(dayValue);
        const currentDay = now.getDay();
        let diff = dayOfWeek - currentDay;
        if (diff < 0) diff += 7;
        const next = new Date(now);
        next.setDate(next.getDate() + diff);
        next.setHours(hour || 0, minute || 0, 0, 0);
        if (next <= now) {
          next.setDate(next.getDate() + 7);
          diff = 7;
        }
        return diff;
      }
      return null;
    }

    function fmtNextOccurrence(period, dayValue, hour = 0, minute = 0) {
      if (!period || dayValue == null) return '—';
      const now = new Date();
      const target = new Date(now);

      if (period === 'monthly') {
        const next = new Date(now.getFullYear(), now.getMonth(), dayValue);
        next.setHours(hour || 0, minute || 0, 0, 0);
        if (next <= now) next.setMonth(next.getMonth() + 1);
        return next.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
      } else if (period === 'weekly') {
        const days = ['周日','周一','周二','周三','周四','周五','周六'];
        const currentDay = target.getDay();
        const dayOfWeek = parseInt(dayValue);
        let diff = dayOfWeek - currentDay;
        if (diff < 0) diff += 7;
        target.setDate(target.getDate() + diff);
        // 如果今天就是重置日但时间已过，算作下周
        const resetTime = new Date(target);
        resetTime.setHours(hour || 0, minute || 0, 0, 0);
        if (diff === 0 && resetTime <= now) {
          target.setDate(target.getDate() + 7);
          diff = 7;
        }
        const timeStr = hour || minute ? ` ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}` : '';
        return `${target.getMonth()+1}/${target.getDate()} ${days[dayOfWeek]}${timeStr}`;
      }
      return '—';
    }

    function getResetDateTime(reset) {
      if (!reset || !reset.period || reset.day == null) return null;
      const now = new Date();

      if (reset.period === 'monthly') {
        const next = new Date(now.getFullYear(), now.getMonth(), reset.day);
        next.setHours(reset.hour || 0, reset.minute || 0, 0, 0);
        if (next <= now) next.setMonth(next.getMonth() + 1);
        return next;
      } else if (reset.period === 'weekly') {
        const dayOfWeek = parseInt(reset.day);
        const currentDay = now.getDay();
        let diff = dayOfWeek - currentDay;
        if (diff < 0) diff += 7;
        const next = new Date(now);
        next.setDate(next.getDate() + diff);
        next.setHours(reset.hour || 0, reset.minute || 0, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 7);
        return next;
      }
      return null;
    }

    function statusFor(expiryDays, resetDays) {
      if (expiryDays !== null && expiryDays <= 0) return 'danger';
      if (resetDays !== null && resetDays <= 3) return 'reset';
      if (expiryDays !== null && expiryDays <= 7) return 'warning';
      if (expiryDays === null && resetDays === null) return 'ok';
      return 'ok';
    }

    // ── Stats ──
    function renderStats() {
      const now = new Date();
      let total = tools.length;
      let expired = 0, soon = 0, resetting = 0;

      tools.forEach(t => {
        const ed = daysUntil(t.expiry?.period, t.expiry?.day);
        const rd = daysUntil(t.reset?.period, t.reset?.day, t.reset?.hour, t.reset?.minute);
        const s = statusFor(ed, rd);
        if (s === 'danger') expired++;
        else if (s === 'warning') soon++;
        else if (s === 'reset') resetting++;
      });

      const monthlyTools = tools.filter(t => t.expiry?.period === 'monthly').length;

      document.getElementById('stats').innerHTML = `
        <div class="stat-card accent">
          <div class="label">已添加工具</div>
          <div class="value">${total}</div>
          <div class="sub">个 AI 工具</div>
        </div>
        <div class="stat-card ${expired > 0 ? 'red' : 'green'}">
          <div class="label">已过期</div>
          <div class="value">${expired}</div>
          <div class="sub">${expired > 0 ? '请续费！' : '一切正常'}</div>
        </div>
        <div class="stat-card orange">
          <div class="label">7 天内到期</div>
          <div class="value">${soon}</div>
          <div class="sub">个订阅</div>
        </div>
        <div class="stat-card accent">
          <div class="label">本月重置</div>
          <div class="value">${resetting}</div>
          <div class="sub">个额度即将重置</div>
        </div>
        <div class="stat-card green">
          <div class="label">月订工具</div>
          <div class="value">${monthlyTools}</div>
          <div class="sub">个按月订阅</div>
        </div>
      `;
    }

    // ── Render ──
    function render(search = '', filter = 'all') {
      renderStats();

      let list = tools;
      if (search) {
        const q = search.toLowerCase();
        list = list.filter(t => t.name.toLowerCase().includes(q) || (t.provider || '').toLowerCase().includes(q));
      }
      if (filter !== 'all') {
        list = list.filter(t => {
          const ed = daysUntil(t.expiry?.period, t.expiry?.day);
          const rd = daysUntil(t.reset?.period, t.reset?.day, t.reset?.hour, t.reset?.minute);
          return statusFor(ed, rd) === filter;
        });
      }

      // 按额度重置时间由近到远排序（含时间，已过时间的排后面）
      list = [...list].sort((a, b) => {
        const da = getResetDateTime(a.reset);
        const db = getResetDateTime(b.reset);
        if (!da && !db) return 0;
        if (!da) return 1;
        if (!db) return -1;
        return da.getTime() - db.getTime();
      });

      const container = document.getElementById('cards');

      if (!list.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📭</div>
            <h3>${search || filter !== 'all' ? '没有匹配的工具' : '还没有添加工具'}</h3>
            <p>${search || filter !== 'all' ? '试试其他关键词或筛选条件' : '点击右上角「添加工具」开始管理你的 AI 订阅'}</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(t => {
        const ed = daysUntil(t.expiry?.period, t.expiry?.day);
        const rd = daysUntil(t.reset?.period, t.reset?.day, t.reset?.hour, t.reset?.minute);
        const s = statusFor(ed, rd);
        const emoji = CATEGORY_EMOJI[t.category] || '🛠️';
        const providerIcon = getProviderIcon(t.provider);
        const iconClass = providerIcon ? 'provider-icon' : 'provider-icon provider-custom';

        const expiryText = ed === null ? '—' :
          ed < 0 ? `已过期 ${Math.abs(ed)} 天` :
          ed === 0 ? '今天到期' :
          ed === 1 ? '明天到期' :
          `还剩 ${ed} 天`;

        const resetText = rd === null ? '—' :
          rd < 0 ? `已重置 ${Math.abs(rd)} 天前` :
          rd === 0 ? '今天重置' :
          rd === 1 ? '明天重置' :
          `还剩 ${rd} 天`;

        const expiryClass = ed !== null ? (ed < 0 ? 'overdue' : ed <= 7 ? 'soon' : 'ok') : 'reset';
        const resetClass = rd !== null ? (rd <= 3 ? 'reset' : 'ok') : '';


        return `
          <div class="card status-${s}">
            <div class="card-header">
              <div style="display:flex;align-items:center;gap:10px;flex:1">
                <div class="${iconClass}">${providerIcon
                  ? `<svg viewBox="0 0 24 24" fill="${providerIcon.color}" xmlns="http://www.w3.org/2000/svg"><path d="${providerIcon.path}"/></svg>`
                  : emoji}</div>
                <div>
                  <div class="card-name">${esc(t.name)}</div>
                  <div class="card-provider">${esc(t.provider || '—')}</div>
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="editTool('${t.id}')" title="编辑">✏️</button>
                <button class="icon-btn del" onclick="deleteTool('${t.id}')" title="删除">🗑️</button>
              </div>
            </div>

            <div class="card-dates">
              <div class="date-row">
                <span class="date-label">🔄 额度重置</span>
                <span class="date-value reset-highlight ${resetClass}">${fmtNextOccurrence(t.reset?.period, t.reset?.day, t.reset?.hour, t.reset?.minute)} · ${resetText}</span>
              </div>
              <div class="date-row" style="flex:0 0 auto">
                <span class="date-label">📅 到期</span>
                <span class="date-value ${expiryClass}">${fmtNextOccurrence(t.expiry?.period, t.expiry?.day)}</span>
              </div>
            </div>

            ${t.quotaPct != null ? `
            <div style="margin-top:8px;position:relative">
              <div style="height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;cursor:pointer" onclick="quickEditQuota('${t.id}')" title="点击快速调整额度百分比">
                <div style="height:100%;width:${Math.max(Math.min(t.quotaPct, 100), 0.5)}%;background:${t.quotaPct > 80 ? 'var(--red)' : t.quotaPct > 50 ? 'var(--orange)' : 'var(--green)'};border-radius:2px;transition:width 0.3s;min-width:2px"></div>
              </div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px;text-align:right">${t.quotaPct.toFixed(1)}%</div>
            </div>` : ''}
          </div>`;
      }).join('');
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Filter ──
    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      render(document.querySelector('.search-box').value, f);
    }

    // ── Quick Edit Quota ──
    function quickEditQuota(id) {
      const t = tools.find(x => x.id === id);
      if (!t) return;
      const newVal = prompt(`调整「${t.name}」的已用额度百分比（当前 ${t.quotaPct != null ? t.quotaPct.toFixed(1) + '%' : '未设置'}）：`, t.quotaPct != null ? t.quotaPct : '');
      if (newVal === null) return;
      const val = parseFloat(newVal);
      if (isNaN(val) || val < 0 || val > 100) { toast('请输入 0~100 的有效数字', '⚠️'); return; }
      t.quotaPct = val;
      persist();
      render(document.querySelector('.search-box').value, currentFilter);
      toast('额度已更新', '✅');
    }

    // ── Modal ──
    function openModal(id = null) {
      document.getElementById('editId').value = id || '';
      document.getElementById('modalTitle').textContent = id ? '✏️ 编辑工具' : '✦ 添加工具';

      if (id) {
        const t = tools.find(x => x.id === id);
        if (!t) return;
        document.getElementById('fName').value = t.name || '';
        document.getElementById('fProvider').value = t.provider || '';
        document.getElementById('fCategory').value = t.category || 'chat';
        document.getElementById('fResetPeriod').value = t.reset?.period || '';
        document.getElementById('fReset').value = t.reset?.day ?? '';
        document.getElementById('fResetHour').value = `${(t.reset?.hour ?? 0).toString().padStart(2,'0')}:${(t.reset?.minute ?? 0).toString().padStart(2,'0')}`;
        document.getElementById('fExpiryPeriod').value = t.expiry?.period || '';
        document.getElementById('fExpiry').value = t.expiry?.day ?? '';
        document.getElementById('fQuotaPct').value = t.quotaPct != null ? t.quotaPct : '';
      } else {
        ['fName','fProvider','fQuotaPct'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fCategory').value = 'chat';
        document.getElementById('fResetPeriod').value = 'weekly';
        document.getElementById('fExpiryPeriod').value = 'monthly';
        updateDayOptions('Reset');
        updateDayOptions('Expiry');
      }

      document.getElementById('modal').classList.add('open');
      setTimeout(() => {
        document.getElementById('fName').focus();
        populateDaySelectors();
        // Restore period/day values for edit mode
        const editId = document.getElementById('editId').value;
        if (editId) {
          const t = tools.find(x => x.id === editId);
          if (t) {
            document.getElementById('fResetPeriod').value = t.reset?.period || '';
            document.getElementById('fReset').value = t.reset?.day ?? '';
            document.getElementById('fExpiryPeriod').value = t.expiry?.period || '';
            document.getElementById('fExpiry').value = t.expiry?.day ?? '';
          }
        }
      }, 50);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function closeModalOutside(e) {
      if (e.target === document.getElementById('modal')) closeModal();
    }

    function saveTool() {
      const name = document.getElementById('fName').value.trim();
      if (!name) { toast('请输入工具名称', '⚠️'); return; }

      const data = {
        name,
        provider: document.getElementById('fProvider').value.trim(),
        category: document.getElementById('fCategory').value,
        reset: (() => {
          const p = document.getElementById('fResetPeriod').value;
          const d = document.getElementById('fReset').value;
          if (!p || !d) return { period: p, day: null, hour: 0, minute: 0 };
          return {
            period: p,
            day: parseInt(d),
            hour: p === 'weekly' ? parseInt(document.getElementById('fResetHour').value?.split(':')[0] || 0) : 0,
            minute: p === 'weekly' ? parseInt(document.getElementById('fResetHour').value?.split(':')[1] || 0) : 0,
          };
        })(),
        expiry: (() => { const p = document.getElementById('fExpiryPeriod').value; const d = document.getElementById('fExpiry').value; return { period: p, day: parseInt(d) }; })(),
        quotaPct: (() => { const v = parseFloat(document.getElementById('fQuotaPct').value); return isNaN(v) ? null : v; })(),
      };

      const editId = document.getElementById('editId').value;
      if (editId) {
        const idx = tools.findIndex(t => t.id === editId);
        if (idx !== -1) { tools[idx] = { ...tools[idx], ...data }; }
        toast('已更新', '✅');
      } else {
        data.id = uid();
        data.created = new Date().toISOString();
        tools.unshift(data);
        toast('已添加', '🎉');
      }

      persist();
      closeModal();
      window.location.reload();
    }

    function editTool(id) { openModal(id); }

    function deleteTool(id) {
      if (!confirm('确定删除这个工具？')) return;
      tools = tools.filter(t => t.id !== id);
      persist();
      render(document.querySelector('.search-box').value, currentFilter);
      toast('已删除', '🗑️');
    }

    // ── Export / Import ──
    function resetDefaults() {
      if (!confirm('将重置所有数据为默认模板，当前数据将丢失。确定？')) return;
      localStorage.removeItem(STORAGE_KEY);
      tools = [...DEFAULT_TOOLS];
      persist();
      populateDaySelectors();
      render(document.querySelector('.search-box').value, currentFilter);
      toast('已重置为默认数据', '↺');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(tools, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ai-tools-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('已导出', '📥');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data)) throw new Error('格式错误');
          tools = data.map(t => ({
            ...t,
            reset: t.reset ? {
          period: t.reset.period || 'weekly',
          day: t.reset.day != null ? parseInt(t.reset.day) : 1,
          hour: t.reset.hour != null ? parseInt(t.reset.hour) : 0,
          minute: t.reset.minute != null ? parseInt(t.reset.minute) : 0,
        } : { period: 'weekly', day: 1, hour: 0, minute: 0 },
            expiry: t.expiry ? { period: t.expiry.period || 'monthly', day: t.expiry.day != null ? parseInt(t.expiry.day) : 7 } : { period: 'monthly', day: 7 },
          }));
          populateDaySelectors();
          persist();
          render();
          toast(`已导入 ${data.length} 条记录`, '📤');
        } catch (err) {
          toast('导入失败：' + err.message, '❌');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // ── Toast ──
    function toast(msg, icon = '✅') {
      const container = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = icon + ' ' + msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ── Keyboard ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'Enter' && document.getElementById('modal').classList.contains('open')) {
        if (e.target.tagName !== 'TEXTAREA') saveTool();
      }
    });

    // ── Init ──
    populateDaySelectors();
    render();
  </script>
</body>
</html>
