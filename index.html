function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function blankForm() {
  return { name: '', provider: '', category: 'chat', resetPeriod: 'weekly', resetDay: '1', resetTime: '00:00', expiryPeriod: 'monthly', expiryDay: '7', quotaPct: '' };
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalize(t) {
  const r = t.reset || {};
  const e = t.expiry || {};
  return {
    id: t.id || uid(), name: t.name || '未命名', provider: t.provider || '', category: t.category || 'chat',
    reset: { period: r.period || 'weekly', day: r.day != null ? parseInt(r.day) : 1, hour: parseInt(r.hour) || 0, minute: parseInt(r.minute) || 0 },
    expiry: { period: e.period || 'monthly', day: e.day != null ? parseInt(e.day) : 7 },
    quotaPct: t.quotaPct != null && t.quotaPct !== '' ? parseFloat(t.quotaPct) : null,
    created: t.created || new Date().toISOString()
  };
}

function nextDate(spec) {
  if (!spec || spec.day == null || isNaN(spec.day)) return null;
  const now = new Date();
  const h = spec.hour || 0, m = spec.minute || 0;
  if (spec.period === 'monthly') {
    let next = new Date(now.getFullYear(), now.getMonth(), spec.day, h, m, 0, 0);
    if (next <= now) next = new Date(now.getFullYear(), now.getMonth() + 1, spec.day, h, m, 0, 0);
    return next;
  }
  let diff = (parseInt(spec.day) - now.getDay() + 7) % 7;
  const next = new Date(now);
  next.setDate(next.getDate() + diff);
  next.setHours(h, m, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 7);
  return next;
}

function rel(date) {
  if (!date) return { text: '—', hours: null };
  const ms = date - new Date();
  const hours = ms / 3600000;
  const d = Math.floor(hours / 24);
  const h = Math.floor(hours % 24);
  if (d >= 1) return { text: h > 0 ? d + ' 天 ' + h + ' 时' : d + ' 天', hours };
  if (hours >= 1) return { text: Math.floor(hours) + ' 小时', hours };
  return { text: Math.max(Math.floor(ms / 60000), 0) + ' 分钟', hours };
}

function fmt(date, withTime) {
  if (!date) return '—';
  const md = (date.getMonth() + 1) + '/' + date.getDate();
  const wd = WEEK[date.getDay()];
  if (!withTime) return md + ' ' + wd;
  const t = String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
  return md + ' ' + wd + ' ' + t;
}

function markOf(t) {
  const hay = ((t.provider || '') + ' ' + (t.name || '')).toLowerCase();
  const brand = BRANDS.find(b => b.keys.some(k => hay.includes(k)));
  const p = (t.provider || t.name || '?').trim();
  const ch = p[0] || '?';
  return { mark: /[a-z]/i.test(ch) ? ch.toUpperCase() : ch, color: brand ? brand.color : '#7b8095', path: brand ? brand.path : null, iconUrl: brand ? brand.iconUrl : null };
}

function view(t) {
  const rd = nextDate(t.reset), ed = nextDate(t.expiry);
  const rr = rel(rd), er = rel(ed);
  const resetSoon = rr.hours != null && rr.hours <= 48;
  const expirySoon = er.hours != null && er.hours <= 24 * 7;
  const { mark, color, path, iconUrl } = markOf(t);
  return {
    t, resetDate: rd, resetHours: rr.hours, expiryHours: er.hours,
    resetSoon, expirySoon, mark, markColor: color, iconPath: path, iconUrl: iconUrl, hasIcon: !!(path || iconUrl), noIcon: !(path || iconUrl),
    resetRel: rr.text, resetWhen: fmt(rd, true),
    expiryWhen: fmt(ed, false), expiryRel: er.text === '—' ? '' : '剩 ' + er.text.split(' ').slice(0, 2).join(' '),
    resetColor: resetSoon ? ACCENT : '#e9eaf0',
    expiryColor: expirySoon ? '#f5a524' : '#9296a6',
    statusColor: expirySoon ? '#f5a524' : resetSoon ? ACCENT : '#2f3444',
    quotaColor: t.quotaPct == null ? null : t.quotaPct >= 90 ? '#f05f5f' : t.quotaPct >= 70 ? '#f5a524' : '#9296a6'
  };
}

function matchFilter(v, f) {
  if (f === 'all') return true;
  if (f === 'reset') return v.resetHours != null && v.resetHours <= 72;
  if (f === 'warning') return v.expirySoon;
  if (f === 'quota') return v.t.quotaPct != null && v.t.quotaPct >= 70;
  if (f === 'ok') return !v.expirySoon && !v.resetSoon;
  return true;
}

function dayOptions(period) {
  if (period === 'weekly') return WEEK.map((d, i) => ({ value: String(i), label: d }));
  return Array.from({ length: 31 }, (_, i) => ({ value: String(i + 1), label: (i + 1) + ' 日' }));
}

function detectBrand(form) {
  const hay = ((form.provider || '') + ' ' + (form.name || '')).toLowerCase();
  if (!hay.trim()) return '__custom__';
  const def = BRAND_GRID.find(b => b.id !== '__custom__' && b.provider && hay.includes(b.provider.toLowerCase()));
  return def ? def.id : '__custom__';
}

/* ---------------- 数据加载 / 保存（pywebview 直连 或 走 server.py） ---------------- */
const PYAPI = () => (window.pywebview && window.pywebview.api) || null;

async function loadData() {
  const api = PYAPI();
  if (api) {
    try {
      const d = await api.get_data();
      if (Array.isArray(d) && d.length) return d.map(normalize);
    } catch (e) {}
  } else {
    try {
      const r = await fetch('ai-tools-data.json', { cache: 'no-store' });
      if (r.ok) {
        const d = await r.json();
        if (Array.isArray(d) && d.length) return d.map(normalize);
      }
    } catch (e) {}
  }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (Array.isArray(d) && d.length) return d.map(normalize); }
  } catch (e) {}
  return DEFAULTS.map(d => ({ ...d, id: uid(), created: new Date().toISOString() }));
}

async function persist(tools) {
  state.tools = tools;
  try { localStorage.setItem(KEY, JSON.stringify(tools)); } catch (e) {}
  const api = PYAPI();
  if (api) {
    try { const res = await api.save_data(tools); if (res && res.ok) { toast('✓ 已保存'); return; } toast('⚠ 保存失败'); } catch (e) { toast('⚠ 保存失败'); }
    return;
  }
  try {
    const r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tools) });
    if (r.ok) { toast('✓ 已保存'); return; }
    toast('⚠ 服务器保存失败');
  } catch (e) { toast('⚠ 离线：仅本地保存'); }
}

function update(tools) { persist(tools); renderDynamic(); }

/* ---------------- 交互 ---------------- */
function open(id) {
  if (!id) { state.modal = true; state.editId = null; state.form = blankForm(); state.brand = '__custom__'; renderModal(); return; }
  const t = state.tools.find(x => x.id === id);
  if (!t) return;
  const form = {
    name: t.name, provider: t.provider, category: t.category,
    resetPeriod: t.reset.period, resetDay: String(t.reset.day),
    resetTime: String(t.reset.hour).padStart(2, '0') + ':' + String(t.reset.minute).padStart(2, '0'),
    expiryPeriod: t.expiry.period, expiryDay: String(t.expiry.day),
    quotaPct: t.quotaPct != null ? String(t.quotaPct) : ''
  };
  state.modal = true; state.editId = id; state.form = form; state.brand = detectBrand(form); renderModal();
}

function pickBrand(id) {
  const def = BRAND_GRID.find(b => b.id === id);
  if (!def) return;
  if (id === '__custom__') { state.form = { ...state.form, name: '', provider: '' }; }
  else { state.form = { ...state.form, name: def.label, provider: def.provider }; }
  state.brand = id; renderModal();
}

function close() { state.modal = false; document.getElementById('modalZone').innerHTML = ''; }

function save() {
  const f = state.form;
  if (!f.name.trim()) return toast('⚠ 请输入工具名称');
  const [h, m] = (f.resetTime || '00:00').split(':');
  const data = normalize({
    id: state.editId, name: f.name.trim(), provider: f.provider.trim(), category: f.category,
    reset: { period: f.resetPeriod, day: f.resetDay, hour: h, minute: m },
    expiry: { period: f.expiryPeriod, day: f.expiryDay },
    quotaPct: f.quotaPct === '' ? null : f.quotaPct
  });
  let tools;
  if (state.editId) { tools = state.tools.map(t => t.id === state.editId ? { ...data, created: t.created } : t); toast('✓ 已更新'); }
  else { tools = [data, ...state.tools]; toast('✓ 已添加'); }
  close();
  update(tools);
}

function del(id) {
  if (!confirm('确定删除该工具？')) return;
  update(state.tools.filter(x => x.id !== id));
  toast('✓ 已删除');
}

function setQuota(id) {
  const v0 = state.tools.find(x => x.id === id);
  if (v0 && v0.quotaLive) return refreshQuota();
  const cur = v0 && v0.quotaPct != null ? v0.quotaPct : '';
  const input = prompt('已用额度百分比 (0–100)，实时账号请点右上角 ↻', cur);
  if (input === null) return;
  const val = input.trim() === '' ? null : parseFloat(input);
  if (val !== null && (isNaN(val) || val < 0 || val > 100)) return toast('⚠ 请输入 0–100');
  update(state.tools.map(x => x.id === id ? { ...x, quotaPct: val, quotaLive: false } : x));
  toast('✓ 额度已更新');
}

async function refreshQuota() {
  toast('正在拉取实时额度…');
  try {
    const api = PYAPI();
    let data;
    if (api) {
      data = await api.refresh_quota();
    } else {
      const r = await fetch('/api/refresh-quota', { method: 'POST' });
      data = await r.json();
    }
    if (!data.ok) throw new Error(data.error || '刷新失败');
    state.tools = data.tools || state.tools;
    try { localStorage.setItem(KEY, JSON.stringify(state.tools)); } catch (e) {}
    renderDynamic();
    const ok = (data.results || []).filter(x => x.ok).length;
    const fail = (data.results || []).filter(x => !x.ok).length;
    toast(fail ? `✓ 实时 ${ok} 个，失败 ${fail} 个` : `✓ 已实时更新 ${ok} 个`);
  } catch (e) {
    toast('⚠ 实时拉取失败：' + (e.message || e));
  }
}

function resetDefaults() {
  if (!confirm('恢复默认示例数据？当前记录将被覆盖。')) return;
  update(DEFAULTS.map(d => normalize({ ...d, id: uid() })));
  toast('✓ 已恢复默认数据');
}

function doExport() {
  const blob = new Blob([JSON.stringify(state.tools, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-tools-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✓ 已导出');
}

function saveToFile() {
  const blob = new Blob([JSON.stringify(state.tools, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-tools-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✓ 已备份到文件');
}

function loadFromFile() {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      update(data.map(t => normalize(t)));
      toast('✓ 已导入 ' + data.length + ' 条');
    } catch (err) { toast('✕ 导入失败：' + err.message); }
  };
  reader.readAsText(file);
  fileInput.value = '';
}

function toast(msg) {
  const id = uid();
  state.toasts.push({ id, msg });
  renderToasts();
  setTimeout(() => { state.toasts = state.toasts.filter(t => t.id !== id); renderToasts(); }, 2600);
}

/* ---------------- 渲染 ---------------- */
function computeViews() {
  return state.tools.map(view).sort((a, b) => (a.resetDate ? a.resetDate.getTime() : Infinity) - (b.resetDate ? b.resetDate.getTime() : Infinity));
}
function computeRows() {
  const views = computeViews();
  const q = state.query.trim().toLowerCase();
  return views
    .filter(v => !q || v.t.name.toLowerCase().includes(q) || (v.t.provider || '').toLowerCase().includes(q))
    .filter(v => matchFilter(v, state.filter));
}

        <div style="font-size:12px; color:#5c6072; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(t.provider || '—')}</div>
      </div>
      <div style="flex:0 1 195px; min-width:170px;">
        <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:3px;">额度重置</div>
        <div style="display:flex; align-items:baseline; gap:7px;">
          <div class="mono" style="font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; color:${v.resetColor};">${esc(v.resetRel)}</div>
          <div class="mono" style="font-size:12px; color:#5c6072; white-space:nowrap;">${esc(v.resetWhen)}</div>
        </div>
      </div>
      <div style="flex:0 1 170px; min-width:148px;">
        <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:3px;">订阅到期</div>
        <div style="display:flex; align-items:baseline; gap:7px; white-space:nowrap;">
          <div class="mono" style="font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; color:${v.expiryColor};">${esc(v.expiryWhen)}</div>
          <div class="mono" style="font-size:12px; color:#5c6072; white-space:nowrap;">${esc(v.expiryRel)}</div>
        </div>
      </div>
      <div style="flex:0 1 120px; min-width:100px;">${quotaBlock}</div>
      <div style="display:flex; gap:6px; justify-content:flex-end; flex:0 0 auto; margin-left:auto;">
        <button class="icon-btn" data-act="edit:${t.id}" title="编辑" style="width:30px; height:30px; font-size:13px;">✎</button>
        <button class="icon-btn" data-act="del:${t.id}" title="删除" style="width:30px; height:30px; font-size:13px;" onmouseover="this.style.color='#ff6b6b';this.style.borderColor='#ff6b6b';this.style.background='rgba(255,107,107,0.1)'" onmouseout="this.style.color='#9296a6';this.style.borderColor='#262a34';this.style.background='#1b1e26'">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderDynamic() { renderHero(); renderChips(); renderList(); }

function renderToasts() {
  const zone = document.getElementById('toastZone');
  zone.innerHTML = state.toasts.map(t => `<div style="padding:11px 17px; border:1px solid #2b3040; border-radius:10px; background:#1b1e26; font-size:13px; color:#e9eaf0; box-shadow:0 12px 32px rgba(0,0,0,0.45); animation:om-toast .22s ease;">${esc(t.msg)}</div>`).join('');
}

function renderModal() {
  const zone = document.getElementById('modalZone');
  if (!state.modal) { zone.innerHTML = ''; return; }
  const f = state.form;
  const resetOpts = dayOptions(f.resetPeriod).map(o => `<option value="${o.value}" ${String(o.value)===String(f.resetDay)?'selected':''}>${esc(o.label)}</option>`).join('');
  const expOpts = dayOptions(f.expiryPeriod).map(o => `<option value="${o.value}" ${String(o.value)===String(f.expiryDay)?'selected':''}>${esc(o.label)}</option>`).join('');
  const brands = BRAND_GRID.map(b => `
    <button data-act="brand:${b.id}" style="padding:8px 10px; border-radius:10px; border:1px solid ${state.brand===b.id?'#8b7cf6':'#262a34'}; background:${state.brand===b.id?'rgba(139,124,246,0.12)':'#1b1e26'}; color:${state.brand===b.id?'#cdbcff':'#9296a6'}; cursor:pointer; font-size:12px; font-weight:600; white-space:nowrap; transition:all .15s;">${esc(b.label)}</button>`).join('');
  zone.innerHTML = `
    <div data-act="overlay" style="position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:24px; background:rgba(6,7,10,0.72); backdrop-filter:blur(6px);">
      <div style="width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:28px; border:1px solid #2b3040; border-radius:18px; background:#14161c; box-shadow:0 24px 80px rgba(0,0,0,0.6); ${zone.querySelector('[data-act="overlay"]')?'animation:none;':'animation:om-in .2s ease;'}">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;">
          <h2 style="font-size:18px; font-weight:700; letter-spacing:-0.01em;">${state.editId?'编辑工具':'添加工具'}</h2>
          <button class="icon-btn" data-act="close" style="width:30px; height:30px; font-size:13px;">✕</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div>
            <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">品牌快捷选择</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">${brands}</div>
          </div>
          <div>
            <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">工具名称</div>
            <input data-field="name" value="${esc(f.name)}" placeholder="例如：ChatGPT Plus" style="width:100%; height:40px; padding:0 13px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:14px; outline:none;" onfocus="this.style.borderColor='#3a4054'" onblur="this.style.borderColor='#262a34'">
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div>
              <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">提供商</div>
              <input data-field="provider" value="${esc(f.provider)}" placeholder="OpenAI / Anthropic…" style="width:100%; height:40px; padding:0 13px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:14px; outline:none;" onfocus="this.style.borderColor='#3a4054'" onblur="this.style.borderColor='#262a34'">
            </div>
            <div>
              <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">分类</div>
              <select data-field="category" style="width:100%; height:40px; padding:0 10px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:14px; outline:none;">
                <option value="chat" ${f.category==='chat'?'selected':''}>聊天助手</option>
                <option value="coding" ${f.category==='coding'?'selected':''}>编程助手</option>
                <option value="image" ${f.category==='image'?'selected':''}>图像生成</option>
                <option value="voice" ${f.category==='voice'?'selected':''}>语音 / 音频</option>
                <option value="search" ${f.category==='search'?'selected':''}>搜索 / 研究</option>
                <option value="other" ${f.category==='other'?'selected':''}>其他</option>
              </select>
            </div>
          </div>
          <div style="padding:16px; border:1px solid #262a34; border-radius:12px; background:#101218;">
            <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:10px;">额度重置</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <select data-field="resetPeriod" style="flex:0 0 92px; height:38px; padding:0 8px; border-radius:9px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:13px; outline:none;">
                <option value="weekly" ${f.resetPeriod==='weekly'?'selected':''}>每周</option>
                <option value="monthly" ${f.resetPeriod==='monthly'?'selected':''}>每月</option>
              </select>
              <select data-field="resetDay" style="flex:1; min-width:110px; height:38px; padding:0 8px; border-radius:9px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:13px; outline:none;">${resetOpts}</select>
              <input type="time" data-field="resetTime" value="${esc(f.resetTime)}" style="flex:0 0 104px; height:38px; padding:0 8px; border-radius:9px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:13px; outline:none; font-family:'JetBrains Mono',monospace;">
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div>
              <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">订阅到期</div>
              <div style="display:flex; gap:8px;">
                <select data-field="expiryPeriod" style="flex:0 0 88px; height:40px; padding:0 8px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:13px; outline:none;">
                  <option value="monthly" ${f.expiryPeriod==='monthly'?'selected':''}>每月</option>
                  <option value="weekly" ${f.expiryPeriod==='weekly'?'selected':''}>每周</option>
                </select>
                <select data-field="expiryDay" style="flex:1; min-width:0; height:40px; padding:0 8px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:13px; outline:none;">${expOpts}</select>
              </div>
            </div>
            <div>
              <div class="mono" style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#6a7085; margin-bottom:7px;">已用额度 %</div>
              <input type="number" min="0" max="100" step="0.1" data-field="quotaPct" value="${esc(f.quotaPct)}" placeholder="留空表示不记录" style="width:100%; height:40px; padding:0 13px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#e9eaf0; font-size:14px; outline:none; font-family:'JetBrains Mono',monospace;" onfocus="this.style.borderColor='#3a4054'" onblur="this.style.borderColor='#262a34'">
            </div>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:26px;">
          <button data-act="close" style="height:38px; padding:0 18px; border-radius:10px; border:1px solid #262a34; background:#1b1e26; color:#9296a6; cursor:pointer; font-size:13px; font-weight:600;">取消</button>
          <button data-act="save" style="height:38px; padding:0 22px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:700; color:#0c0d11; background:${ACCENT};">保存</button>
        </div>
      </div>
    </div>`;
}

/* ---------------- 事件 ---------------- */
const app = document.getElementById('app');
const fileInput = document.getElementById('fileInput');

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'overlay') { if (e.target === el) close(); return; }
  if (act === 'add') return open(null);
  if (act === 'close') return close();
  if (act === 'save') return save();
  if (act === 'saveall') return persist(state.tools);
  if (act === 'refreshquota') return refreshQuota();
  if (act === 'reset') return resetDefaults();
  if (act === 'export') return doExport();
  if (act === 'import') { fileInput.click(); return; }
  if (act === 'savefile') return saveToFile();
  if (act === 'loadfile') return loadFromFile();
  if (act.startsWith('edit:')) return open(act.slice(5));
  if (act.startsWith('del:')) return del(act.slice(4));
  if (act.startsWith('quota:')) return setQuota(act.slice(6));
  if (act.startsWith('brand:')) return pickBrand(act.slice(6));
  if (act.startsWith('chip:')) { state.filter = act.slice(5); renderChips(); renderList(); return; }
});

function onField(e) {
  const el = e.target.closest('[data-field]');
  if (!el) return;
  const f = el.getAttribute('data-field');
  if (f === 'search') { state.query = el.value; renderDynamic(); return; }
  state.form[f] = el.value;
  if (f === 'resetPeriod' || f === 'expiryPeriod') renderModal();
}
app.addEventListener('input', onField);
app.addEventListener('change', onField);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal) close();
  if (e.key === 'Enter' && state.modal && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) save();
});

/* ---------------- 启动 ---------------- */
renderShell();
loadData().then(tools => { state.tools = tools; renderDynamic(); });
setInterval(() => { state.tick++; renderDynamic(); }, 30000);

/* pywebview 无边框窗口：启用深色自定义标题栏并接线最小化/关闭/拖动 */
window.addEventListener('pywebviewready', () => {
  const api = PYAPI();
  if (!api) return;
  document.body.classList.add('framed');
  // 拖动：mousedown 时同步拿窗口位置，mousemove 算差值迁窗
  const tb = document.getElementById('titlebar');
  if (tb) {
    let _moving = false, _sx = 0, _sy = 0, _wx = 0, _wy = 0;
    tb.addEventListener('mousedown', e => {
      if (e.target.closest('.tb-btn')) return;
      _moving = true;
      _sx = e.screenX; _sy = e.screenY;
      try { [_wx, _wy] = api.win_get_pos(); } catch (_) {}
      tb.style.cursor = 'grabbing';
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!_moving) return;
      api.win_move(_wx + (e.screenX - _sx), _wy + (e.screenY - _sy));
    });
    window.addEventListener('mouseup', () => {
      if (!_moving) return;
      _moving = false;
      tb.style.cursor = '';
    });
  }
  const bMin = document.getElementById('tbMin');
  const bClose = document.getElementById('tbClose');
  if (bMin) bMin.onclick = () => api.win_minimize();
  if (bClose) bClose.onclick = () => api.win_close();
});
</script>
