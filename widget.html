<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雪糕 · 桌面小窗</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d11;
      --surface: #14161c;
      --surface-2: #1b1e27;
      --border: #2b3040;
      --text: #e9eaf0;
      --muted: #9296a6;
      --accent: #8b7cf6;
      --teal: #45d2c6;
      --orange: #f5a524;
      --red: #f87171;
      --shadow: 0 24px 60px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }
    .widget {
      width: 380px;
      min-height: 520px;
      max-height: 720px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 20px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      transform: rotate(-12deg);
    }
    .brand span {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .stats {
      flex: 1;
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .menu {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
    }
    .menu:hover { color: var(--text); background: var(--surface-2); }

    /* Hero */
    .hero {
      margin: 0 16px 12px;
      padding: 18px 20px 16px;
      background: linear-gradient(135deg, rgba(139,124,246,0.12), rgba(139,124,246,0.03));
      border: 1px solid rgba(139,124,246,0.18);
      border-radius: 20px;
    }
    .hero-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .hero-count {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }
    .hero-count span {
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      margin: 0 2px;
    }
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hero-tool {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .hero-tool img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .hero-tool svg {
      width: 20px;
      height: 20px;
    }
    .hero-tool .mono {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      border-radius: 5px;
      background: var(--surface-2);
    }
    .hero-date {
      font-size: 12px;
      color: var(--muted);
    }

    /* List */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 8px;
    }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .item {
      padding: 14px 16px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: background .15s ease;
    }
    .item:hover { background: var(--surface-2); }
    .item-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
    }
    .item-left img, .item-left svg {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .item-left .mono {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      border-radius: 5px;
      background: var(--surface-2);
    }
    .item-right {
      text-align: right;
    }
    .item-days {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .item-expiry {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .progress {
      height: 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }
    .progress .bar {
      height: 100%;
      border-radius: 3px;
      transition: width .3s ease;
    }
    .pct {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 7px;
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 18px;
      font-size: 12px;
      color: var(--muted);
    }
    .update { display: flex; align-items: center; gap: 6px; }
    .update::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    footer a:hover { text-decoration: underline; }

    .empty, .error {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="widget" id="root">
    <div class="empty">正在加载…</div>
  </div>

  <script>
    const BRANDS = [
      { keys: ['openai','chatgpt','gpt'], color: '#10a37f', path: 'M22.44 11.32c.39-.81.48-1.72.25-2.57-.35-1.31-1.4-2.36-2.71-2.71a4.12 4.12 0 0 0-2.57.25 4.78 4.78 0 0 0-1.57-1.1 4.86 4.86 0 0 0-5.46 1.06 4.88 4.88 0 0 0-1.06 5.46 4.79 4.79 0 0 0-1.1 1.57 4.12 4.12 0 0 0 .25 2.57c.35 1.31 1.4 2.36 2.71 2.71.81.39 1.72.48 2.57.25.43.63.96 1.15 1.57 1.57a4.86 4.86 0 0 0 5.46-1.06 4.88 4.88 0 0 0 1.06-5.46 4.79 4.79 0 0 0 1.1-1.57ZM15.2 7.46c.5-.04 1 .1 1.43.39.66.44 1.07 1.18 1.12 2 .03.5-.1 1-.39 1.43-.44.66-1.18 1.07-2 1.12-.5.03-1-.1-1.43-.39-.66-.44-1.07-1.18-1.12-2-.03-.5.1-1 .39-1.43.44-.66 1.18-1.07 2-1.12Zm-5.17 3.55c.04-.5.38-.95.86-1.17.48-.22 1.05-.18 1.49.11.44.29.71.78.71 1.31 0 .53-.27 1.02-.71 1.31-.44.29-1.01.33-1.49.11-.48-.22-.82-.67-.86-1.17Zm3.03 7.05c-.5.04-1-.1-1.43-.39-.66-.44-1.07-1.18-1.12-2-.03-.5.1-1 .39-1.43.44-.66 1.18-1.07 2-1.12.5-.03 1 .1 1.43.39.66.44 1.07 1.18 1.12 2 .03.5-.1 1-.39 1.43-.44.66-1.18 1.07-2 1.12Zm5.17-3.55c-.04.5-.38.95-.86 1.17-.48.22-1.05.18-1.49-.11-.44-.29-.71-.78-.71-1.31 0-.53.27-1.02.71-1.31.44-.29 1.01-.33 1.49-.11.48.22.82.67.86 1.17Z' },
      { keys: ['anthropic','claude'], color: '#d97757', path: 'M17.56 15.91h3.26l-5.35-12.6h-2.74L7.38 15.91h3.26l.92-2.32h5.08Zm-2.54-6.02h-2.84l1.42-3.6ZM9.09 18.09H5.83l5.35 12.6h2.74l5.35-12.6h-3.26l-.92 2.32H9.74Z' },
      { keys: ['cursor'], color: '#1a1a1a', path: 'M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Zm3-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Zm5 3 5 5-5 5V8Z' },
      { keys: ['grok','xai','x.ai'], color: '#000000', path: 'M2.5 2h19v20h-19z M4 4h4v4h-4z M10 4h4v4h-4z M16 4h4v4h-4z M4 10h10v2h-10z M4 14h6v2h-6z M4 18h8v2h-8z M16 10h4v10h-4z' },
      { keys: ['kimi','moonshot'], color: '#8b93ff', iconUrl: 'kimi.svg' },
      { keys: ['perplexity'], color: '#20c997', path: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 5h2v5.17l3.59-2.08 1 1.73L12 15.5V7Z' }
    ];

    function nextDate(cfg, now) {
      const d = new Date(now.getTime());
      d.setUTCMinutes(0, 0, 0);
      const period = cfg.period || 'monthly';
      const day = cfg.day ?? 1;
      const hour = cfg.hour ?? 0;
      const minute = cfg.minute ?? 0;

      if (period === 'weekly') {
        const target = new Date(d);
        target.setUTCHours(hour, minute, 0, 0);
        const diff = (day - target.getUTCDay() + 7) % 7;
        target.setUTCDate(target.getUTCDate() + diff);
        if (target <= now) target.setUTCDate(target.getUTCDate() + 7);
        return target;
      }

      if (period === 'daily') {
        const target = new Date(d);
        target.setUTCHours(hour, minute, 0, 0);
        if (target <= now) target.setUTCDate(target.getUTCDate() + 1);
        return target;
      }

      const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), day, hour, minute, 0));
      if (target <= now) target.setUTCMonth(target.getUTCMonth() + 1);
      return target;
    }

    function rel(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      return { days, hours, totalSec };
    }

    function fmt(d) {
      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${weekdays[d.getUTCDay()]}`;
    }

    function markOf(name) {
      const n = name.toLowerCase();
      const brand = BRANDS.find(b => b.keys.some(k => n.includes(k)));
      const ch = name.trim()[0] || '?';
      return { mark: /[a-z]/i.test(ch) ? ch.toUpperCase() : ch, color: brand ? brand.color : '#7b8095', path: brand ? brand.path : null, iconUrl: brand ? brand.iconUrl : null };
    }

    function quotaColor(pct) {
      if (pct >= 80) return { bar: 'var(--red)', text: 'var(--red)' };
      if (pct >= 50) return { bar: 'var(--orange)', text: 'var(--orange)' };
      return { bar: 'var(--teal)', text: 'var(--teal)' };
    }

    function view(t) {
      const now = new Date();
      const reset = nextDate(t.reset, now);
      const expiry = nextDate(t.expiry, now);
      const resetRel = rel(reset - now);
      const expiryRel = rel(expiry - now);
      const { mark, color, path, iconUrl } = markOf(t.name);
      const qc = quotaColor(t.quotaPct || 0);

      return {
        id: t.id,
        name: t.name,
        quotaPct: Math.round(t.quotaPct || 0),
        resetDays: resetRel.days,
        resetHours: resetRel.hours,
        expiryDays: expiryRel.days,
        expiryHours: expiryRel.hours,
        resetDate: fmt(reset),
        expiryDate: fmt(expiry),
        mark, markColor: color, iconPath: path, iconUrl,
        hasIcon: !!path || !!iconUrl,
        noIcon: !path && !iconUrl,
        barColor: qc.bar,
        textColor: qc.text
      };
    }

    function iconHtml(v, size = 22) {
      if (v.iconUrl) return `<img src="${v.iconUrl}" width="${size}" height="${size}" alt="">`;
      if (v.hasIcon) return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="${v.markColor}"><path d="${v.iconPath}"></path></svg>`;
      return `<span class="mono" style="color:${v.markColor};">${v.mark}</span>`;
    }

    async function load() {
      try {
        const res = await fetch('/ai-tools-data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const tools = await res.json();
        render(tools);
      } catch (e) {
        console.error(e);
        document.getElementById('root').innerHTML = `<div class="error">无法加载数据<br>请确保 start.bat/widget.bat 已启动服务</div>`;
      }
    }

    function render(tools) {
      const views = tools.map(view);
      const total = views.length;
      const expiringSoon = views.filter(v => v.expiryDays <= 7).length;
      const resettingSoon = views.filter(v => v.resetDays <= 1).length;
      const hero = views.slice().sort((a, b) => (a.resetDays * 24 + a.resetHours) - (b.resetDays * 24 + b.resetHours))[0];
      const list = views.slice().sort((a, b) => (a.expiryDays * 24 + a.expiryHours) - (b.expiryDays * 24 + b.expiryHours)).slice(0, 5);

      const nowStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      document.getElementById('root').innerHTML = `
        <header>
          <div class="brand">
            <img src="logo.png" alt="logo">
            <span>雪糕</span>
          </div>
          <div class="stats">${total} 个订阅 · ${expiringSoon} 个将到期 · ${resettingSoon} 个快重置</div>
          <button class="menu" onclick="location.reload()">↻</button>
        </header>

        <section class="hero">
          <div class="hero-label">下一次重置</div>
          <div class="hero-count">${hero.resetDays}<span>天</span>${hero.resetHours}<span>时</span>后重置</div>
          <div class="hero-row">
            <div class="hero-tool">${iconHtml(hero, 20)}<span>${hero.name}</span></div>
            <div class="hero-date">${hero.resetDate}</div>
          </div>
        </section>

        <section class="list">
          ${list.map(v => `
            <div class="item">
              <div class="item-main">
                <div class="item-left">${iconHtml(v, 22)}<span>${v.name}</span></div>
                <div class="item-right">
                  <div class="item-days" style="color:${v.textColor}">${v.expiryDays}天${v.expiryHours}时</div>
                  <div class="item-expiry">${v.expiryDays <= 7 ? '到期' : '续费'} ${v.expiryDate}</div>
                </div>
              </div>
              <div class="progress"><div class="bar" style="width:${v.quotaPct}%; background:${v.barColor}"></div></div>
              <div class="pct"><span></span><span style="color:${v.textColor}">${v.quotaPct}%</span></div>
            </div>
          `).join('')}
        </section>

        <footer>
          <div class="update">更新于 ${nowStr}</div>
          <a href="index.html" target="_blank">打开完整视图 ↗</a>
        </footer>
      `;
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
